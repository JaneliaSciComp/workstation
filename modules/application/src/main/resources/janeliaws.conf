# ${HOME} will be replaced by user home directory according to platform
default_userdir="${HOME}/.JaneliaWorkstation/0.4"
default_mac_userdir="${HOME}/Library/Application Support/JaneliaWorkstation/0.4"

# options used by the launcher by default, can be overridden by explicit
# command line switches

default_options="--branding ${brandingToken} --laf com.formdev.flatlaf.FlatDarkLaf -J-Dbranding.token=${brandingToken} -J-Dapple.awt.brushMetalLook=false -J-XX:+UseParallelGC -J-Dhttp.maxConnections=20 -J-Xms1024m -J-Xmx8192m -J-Dnetbeans.exception.alert.min.level=2000 -J-Dnetbeans.exception.report.min.level=3000 -J-Dplugin.manager.check.interval=10 -J-Dplugin.manager.check.new.plugins=true -J-Dplugin.manager.check.updates=true -J--add-exports=java.desktop/sun.swing=ALL-UNNAMED -J--add-opens=java.base/java.lang=ALL-UNNAMED -J--add-opens=java.base/java.lang.reflect=ALL-UNNAMED -J--add-opens=java.base/java.net=ALL-UNNAMED -J--add-opens=java.base/java.nio=ALL-UNNAMED -J--add-opens=java.base/java.util=ALL-UNNAMED -J--add-opens=java.base/java.security=ALL-UNNAMED -J--add-opens=java.desktop/javax.swing=ALL-UNNAMED -J--add-opens=java.desktop/javax.swing.plaf.basic=ALL-UNNAMED -J--add-opens=java.desktop/java.awt=ALL-UNNAMED -J--add-opens=java.desktop/sun.awt=ALL-UNNAMED -J--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED"

# for development purposes you may wish to append: -J-Dnetbeans.logger.console=true -J-ea

# default location of JDK/JRE, can be overridden by using --jdkhome <dir> switch
#jdkhome="/path/to/jdk"

# clusters' paths separated by path.separator (semicolon on Windows, colon on Unices)
#extra_clusters=
